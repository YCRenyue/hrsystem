services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: hr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hr_system}
      MYSQL_USER: ${MYSQL_USER:-hr_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=384M
      - --max-connections=50
      - --performance-schema=OFF
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - hr_network
    mem_limit: 640m

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: docker.m.daocloud.io
    container_name: hr_backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hr_system}
      DB_USER: ${MYSQL_USER:-hr_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 24h
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 10485760
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-System Administrator}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hr_network
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        DOCKER_REGISTRY: docker.m.daocloud.io
        REACT_APP_API_URL: /api
    container_name: hr_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hr_network
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  backend_uploads:

networks:
  hr_network:
    driver: bridge
