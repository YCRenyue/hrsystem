name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '22.x'

jobs:
  backend-lint:
    name: Backend Checks
    runs-on: ubuntu-24.04

    # Integration tests create and migrate their own hr_system_test_* databases here
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend linting
        run: |
          cd backend
          npm run lint

      - name: Run backend tests
        run: |
          cd backend
          set -o pipefail
          npm test -- --runInBand --silent 2>&1 | tee jest-output.txt
        shell: bash
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ci-test-root

      - name: Summarize backend test failures
        if: failure()
        run: |
          {
            echo '## Backend test failures'
            echo '```'
            grep -E '●|Tests:|Test Suites:|Expected|Received|Error' backend/jest-output.txt | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as one annotation, which is readable without signing in
          msg=$(grep -E '●|Tests:|Test Suites:|Expected|Received|Error' backend/jest-output.txt \
            | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Backend test failures::${msg}"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend type and lint checks
        run: |
          cd frontend
          npx tsc --noEmit
          npx eslint src/ --max-warnings=0

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for emoji in files (except requirement.md)
        run: |
          echo "Checking for emoji usage in code files..."
          if find . -type f \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./backend/node_modules/*" \
            -not -path "./frontend/node_modules/*" \
            -not -path "./requirement.md" \
            -not -path "./.github/*" \
            -not -path "*/coverage/*" \
            -not -path "*/build/*" \
            -regex ".*\.\(js\|ts\|jsx\|tsx\|json\|md\|txt\|yml\|yaml\)" \
            -exec grep -l "[😀-🙏🌀-🗿🚀-🛿]" {} \; | grep -v requirement.md; then
            echo "ERROR: Emoji found in code files (emoji only allowed in requirement.md)"
            exit 1
          else
            echo "No emoji found in code files - PASS"
          fi

      - name: Check file size limits
        run: |
          echo "Checking for files over 500 lines..."
          find backend/src frontend/src -type f \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \) 2>/dev/null | while read file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "WARNING: $file has $lines lines (limit: 500)"
            fi
          done || true

  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs: [backend-lint, frontend-build, code-quality]
    if: always()

    steps:
      - name: Check CI status
        run: |
          echo "CI Pipeline Summary:"
          echo "==================="
          echo "Backend Linting: ${{ needs.backend-lint.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"

          if [[ "${{ needs.backend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.code-quality.result }}" == "failure" ]]; then
            echo "CI Pipeline FAILED"
            exit 1
          else
            echo "CI Pipeline PASSED"
          fi
